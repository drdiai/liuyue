<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小学数学 · liuyue</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      letter-spacing: -0.01em;
    }

    p.lead {
      margin: 0 0 32px;
      color: #6e7781;
      font-size: 0.95rem;
    }

    /* 单列布局 */
    .col h2 {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 14px;
      padding: 0 4px;
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #16a34a;
    }
    .col h2 .en {
      font-size: 0.72rem;
      color: #afb8c1;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: none;
    }

    /* 按天分组 */
    .day-group + .day-group { margin-top: 18px; }
    .day-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 0 4px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #57606a;
    }
    .day-header .rel {
      font-size: 0.66rem;
      font-weight: 500;
      color: #afb8c1;
      letter-spacing: 0.02em;
    }
    .day-header.today { color: #16a34a; }
    .day-items { padding: 0; margin: 0; list-style: none; }
    .day-items li + li { margin-top: 8px; }

    /* 卡片链接 */
    ul { padding: 0; margin: 0; list-style: none; }
    a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px;
      border: 1px solid #d0d7de;
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a:hover, a:focus-visible {
      border-color: #16a34a;
      outline: none;
    }

    .badge {
      display: inline-block;
      font-size: 0.66rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.04em;
      margin-left: auto;
      color: #16a34a;
      background: #dcfce7;
      border: 1px solid #bbf7d0;
    }
    .new {
      display: inline-block;
      color: #cf222e;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-left: auto;
      padding: 2px 7px;
      border: 1px solid #cf222e;
      border-radius: 4px;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      color: #8b949e;
      font-size: 0.95rem;
      border: 1px dashed #d0d7de;
      border-radius: 10px;
    }
    .empty .hint {
      display: block;
      margin-top: 8px;
      font-size: 0.85rem;
      color: #afb8c1;
    }

    @media (prefers-color-scheme: dark) {
      .day-header { color: #8b949e; }
      .day-header .rel { color: #6e7681; }
      .day-header.today { color: #3fb950; }
      a { border-color: #30363d; }
      a:hover, a:focus-visible { border-color: #3fb950; }
      .col h2 { color: #3fb950; }
      p.lead { color: #8b949e; }
      .col h2 .en { color: #6e7681; }
      .badge { background: #14532d; border-color: #16a34a; color: #4ade80; }
      .empty { border-color: #30363d; }
    }

    footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #eaeef2;
      color: #8b949e;
      font-size: 0.82rem;
    }
    @media (prefers-color-scheme: dark) {
      footer { border-color: #21262d; }
    }
  </style>
</head>
<body>
  <h1>小学数学 · liuyue</h1>
  <p class="lead">北师大版 5/6 年级数学 · 单元复习 / 期末复习 / 错题周周清 一页纸合集</p>

  <div class="col">
    <h2>小学数学<span class="en">Elementary School Math · onepage 集合</span></h2>

    <div class="empty">
      还没有内容。
      <span class="hint">下一份小学数学一页纸会自动出现在这里。</span>
    </div>
  </div>

  <footer style="text-align: center;">
    <div style="margin: 6px 0 2px;"><b style="color: #111827;">由 DONG XINGBO 创建整理</b> · 非授权禁止转载</div>
    <div style="font-size: 11.5px; color: #9ca3af;">© 2026 DONG XINGBO · All rights reserved</div>
    <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid #eaeef2; color: #8b949e; font-size: 0.82rem;">
      维护于 GitHub Pages · xingbod/liuyue · 添加新项目：在 ul.day-items 里追加 &lt;li&gt;&lt;a&gt; 即可
    </div>
  </footer>
</body>
</html>
